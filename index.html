function choiceCopies(card){
  const e=card[1];
  const pos=Math.max(e.p||0,e.f||0,e.b||0);
  const neg=Object.values(e).some(v=>v<0);
  // Ver.0.5: strong +2 cards are rarer; +1 / balanced cards form the core of the physical deck.
  if(pos>=2 && !neg) return 1;
  if(neg) return 2;
  return 3;
}
function choicePoolForStage(stage){
  if(stage==="highschool") return C.highschool_choice||[];
  if(stage==="college") return C.college_choice||[];
  return C.choice||[];
}
function makeChoiceDeck(stage=state.stage){
  const deck=[];
  choicePoolForStage(stage).forEach(card=>{
    for(let i=0;i<choiceCopies(card);i++) deck.push(card);
  });
  return shuffle(deck);
}
function fateCopies(card){
  const e=card[1];
  const maxPos=Math.max(e.a||0,e.p||0,e.f||0,e.b||0);
  const hasNeg=Object.values(e).some(v=>v<0);
  // +3 is a true rare. Neutral/negative outcomes occupy more cards in the finite deck.
  if(maxPos>=3) return 1;
  if(hasNeg) return 2;
  return 2;
}
function makeFateDeck(stage){
  const deck=[];
  (C[stage+"_fate"]||[]).forEach(card=>{for(let i=0;i<fateCopies(card);i++) deck.push(card)});
  return shuffle(deck);
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function initFiniteDecks(){
  state.choiceDeck=makeChoiceDeck(state.stage);
  state.fateDecks={
    highschool:makeFateDeck("highschool"),
    college:makeFateDeck("college"),
    rookie:makeFateDeck("rookie"),
    prime1:makeFateDeck("prime1"),
    prime2:makeFateDeck("prime2"),
    veteran:makeFateDeck("veteran")
  };
}
function drawChoiceOffer(){
  if(!state.choiceDeck || state.choiceDeck.length<3){
    state.choiceDeck=makeChoiceDeck(state.stage);
  }
  const picked=state.choiceDeck.splice(0,3);
  state._currentOffer=picked;
  return picked;
}
function resolveChoiceSelection(name){
  const offer=state._currentOffer||[];
  const selectedIndex=offer.findIndex(c=>c[0]===name);
  const unselected=offer.filter((_,i)=>i!==selectedIndex);
  // chosen card stays out; unselected cards return to deck, then reshuffle
  state.choiceDeck=shuffle([...(state.choiceDeck||[]),...unselected]);

 let head=`${progress()}<div class=stage>${LABEL[state.stage]}</div>${race()}`;
 if(state.phase==="marketStart"){
   g.innerHTML=`<div class=panel>${head}<div class=stage>SELECTION PHASE</div><h2>手番順</h2><p class=desc>🏆実績 → 📈成績 → 🔥努力 → 🤝物語 の低い順。すべて同点ならPLAYER番号順です。</p><div class=awards>${state.turnOrder.map((pid,i)=>{const x=state.players.find(p=>p.id===pid),ss=statObj(x);return `<div class=award><b>${i+1}. ${x.name}</b>　🏆${ss.a} 📈${ss.p} 🔥${ss.f} 🤝${ss.b}</div>`}).join("")}</div><button type="button" class="bigbtn" onclick="window.startMarketRound()">選択1巡目を開始</button></div>`;return
 }
 if(state.phase==="market"){
   const mp=activeMarketPlayer(),round=state.marketRound+1,pick=state.marketPickIndex+1,totalRounds=selectionRoundTarget(state.stage);
   g.innerHTML=`<div class=panel>${head}<div class=stage>SELECTION ROUND ${round} / ${totalRounds}</div><div class=turnbox><div class=turnname>${mp.type==="cpu"?"🤖":"👤"} ${mp.name}</div><div class=cpu>${pick}番手 / ${state.turnOrder.length}</div></div>${stats(statObj(mp))}<p class=desc>場の${state.market.length}枚から1枚選択。取られたカードは場から消えます。</p><div class=cards>${state.market.map((c,i)=>mp.type==="human"?`<button class=card onclick=chooseMarketCard(${i})><b>${c[0]}</b><div class=effect>${eff(c[1])}</div><div class=tag>${c[2]}</div></button>`:`<div class=card><b>${c[0]}</b><div class=effect>${eff(c[1])}</div><div class=tag>${c[2]}</div></div>`).join("")}</div>${mp.type==="cpu"?`<button class=bigbtn onclick=cpuChooseMarket()>CPUの選択を見る</button>`:""}${logBox()}</div>`;return
 }
 if(state.phase==="fateStageStart"){
   g.innerHTML=`<div class=panel>${head}<div class=stage>SELECTION COMPLETE</div><h2>運命フェーズへ</h2><p class=desc>このステージの選択が終了しました。次は同じ手番順で各プレイヤーが運命カードを処理します。</p>${race()}<button class=bigbtn onclick=beginFateStage()>運命カードへ</button></div>`;return
 }
 if(state.stage==="draft"){
   if(state.phase==="draftResult"){
     g.innerHTML=`<div class=panel>${head}<div class=stage>DRAFT RESULTS</div><h2>指名結果</h2><p class=desc>学生時代の評価から、4人のドラフト指名巡が決定しました。</p><div class=draftresults>${state.players.map((x,i)=>`<div class="draftrow ${x.type==="human"?"human":""}"><div class=draftplace>${x.type==="human"?"👤":"🤖"}</div><div class=draftwho>${x.name}</div><div class=draftpick>${x.draft||"—"}</div></div>`).join("")}</div><button class=bigbtn onclick=beginRookie()>BEGIN ROOKIE SEASON</button></div>`;return
   }
   g.innerHTML=`<div class=panel>${head}<div class=reveal><div class=icon>🏈</div><h3>DRAFT DAY</h3><p class=desc>4人の学生時代を同時に評価します。</p>${state.players.map(x=>`<div class=award><b>${x.name}</b>　📈${x.student.p} 🔥${x.student.f} 🤝${x.student.b}</div>`).join("")}<button class=bigbtn onclick=doDraftAll()>DRAFT RESULTS</button></div></div>`;return
 }
 if(state.stage==="legacy"){
   let sorted=[...state.players].sort((a,b)=>({SS:5,S:4,A:3,B:2,C:1}[b.legacy.rank]-{SS:5,S:4,A:3,B:2,C:1}[a.legacy.rank])||b.nfl.a-a.nfl.a||b.nfl.p-a.nfl.p);
   g.innerHTML=`<div class=panel>${head}<div class=stage>CAREER COMPLETE</div><h2>LEGACY RANKING</h2><p class=desc>最終順位とキャリア経路を1画面で比較。テスト結果の共有用サマリーです。</p><div class=legacygrid>${sorted.map(compactLegacyCard).join("")}</div><button class=bigbtn onclick=showCareer()>CAREER SUMMARY</button><button class=ghost onclick=restart()>NEW GAME</button></div>`;return
 }
 if(state.phase==="handoff"){
   g.innerHTML=`<div class=panel>${head}<div class=handoff><div class=cpu>PASS THE DEVICE</div><div class=who>👤 ${p.name}</div><p class=desc>他のプレイヤーにカードを見られないよう、本人が準備できたら開いてください。</p><button class=bigbtn onclick=enterHumanChoice()>カードを見る</button></div></div>`;return
 }
 if(state.phase==="handoffFate"){
   g.innerHTML=`<div class=panel>${head}<div class=handoff><div class=cpu>PASS THE DEVICE</div><div class=who>👤 ${p.name}</div><p class=desc>運命カードを引きます。</p><button class=bigbtn onclick=enterHumanFate()>運命へ</button></div></div>`;return
 }
 if(state.phase==="choose"){
   g.innerHTML=`<div class=panel>${head}<div class=turnbox><div class=turnname>👤 ${p.name}</div><div class=cpu>HUMAN TURN</div></div>${stats(s)}<h3>選択 ${p.choiceCount+1} / ${stageChoiceTarget(state.stage)}</h3><div class=cards>${p.offer.map(cardHTML).join("")}</div>${logBox()}</div>`;return
 }
 if(state.phase==="cpuChoice"){
   g.innerHTML=`<div class=panel>${head}<div class=turnbox><div class=turnname>🤖 ${p.name}</div><div class=cpu>CPU IS CHOOSING...</div></div>${stats(s)}<p class=desc>CPUも同じ3枚から1枚を選びます。</p><button class=bigbtn onclick=cpuDoChoice()>CPUの選択を見る</button>${logBox()}</div>`;return
 }
 if(state.phase==="fate"){
   g.innerHTML=`<div class=panel>${head}<div class=turnbox><div class=turnname>👤 ${p.name}</div></div>${stats(s)}<div class=reveal><div class=icon>🎴</div><h3>運命 ${p.fateCount+1} / ${fateTarget(state.stage)}</h3><button class=bigbtn onclick=revealHumanFate()>運命カードを引く</button></div>${logBox()}</div>`;return
 }
 if(state.phase==="fateResult"){
   let c=p.cards[p.cards.length-1];g.innerHTML=`<div class=panel>${head}${stats(s)}<div class="reveal flash"><div class=icon>⚡</div><h3>${c.name}</h3><div class=effect>${eff(c.e)}</div></div><button class=bigbtn onclick=afterAction()>続ける</button>${logBox()}</div>`;return
 }
 if(state.phase==="cpuFate"){
   g.innerHTML=`<div class=panel>${head}<div class=turnbox><div class=turnname>🤖 ${p.name}</div><div class=cpu>CPU FATE</div></div>${stats(s)}<button class=bigbtn onclick=cpuDoFate()>CPUの運命を見る</button>${logBox()}</div>`;return
 }
 if(state.phase==="playerDone"){
   g.innerHTML=`<div class=panel>${head}<div class=reveal><div class=icon>✅</div><h3>${p.name} — TURN COMPLETE</h3>${stats(s)}<button class=bigbtn onclick=nextSeat()>${state.active<3?"NEXT PLAYER":"STAGE RESULT"}</button></div>${logBox()}</div>`;return
 }
 if(state.phase==="humanTitle"){
   let opts=p._titleOptions||[];g.innerHTML=`<div class=panel>${head}<div class=turnbox><div class=turnname>👤 ${p.name}</div><div class=cpu>TITLE CARD</div></div><p class=desc>条件を満たした称号から1枚選択します。CPUも同じ条件で1枚獲得します。</p><div class=titlelist>${opts.map((t,i)=>`<div class="title ok"><div class=row><b>${t[0]}</b><span>${eff(t[1])}</span></div><button class=ghost onclick=chooseHumanTitle(${i})>この称号を選ぶ</button></div>`).join("")}</div></div>`;return
 }
 if(state.phase==="stageAwards"){
   g.innerHTML=`<div class=panel>${head}<div class=stage>${LABEL[state.stage]} AWARDS</div><h2>4人の結果</h2><div class=awards>${state.awards.map(a=>`<div class=award><b>${a.player}</b>　${a.title}</div>`).join("")}</div>${race()}<button class=bigbtn onclick=afterAwards()>${state.stage==="veteran"?"LEGACYへ":"NEXT STAGE"}</button></div>`;return
 }
}
function showCareer(){
 let a=["PLAY CALL — LEGACY MODE Ver.0.8","MULTIPLAYER CAREER SUMMARY",""];
 state.players.forEach((p,i)=>{
   a.push(`${i+1}. ${p.name} [${p.type.toUpperCase()}]`);
   const hs=studentAt(p,"highschool"),co=studentAt(p,"college");
   a.push(`HIGH SCHOOL：📈${hs.p} 🔥${hs.f} 🤝${hs.b}`);
   a.push(`COLLEGE：📈${co.p} 🔥${co.f} 🤝${co.b}`);
   a.push(`DRAFT：${p.draft||"-"}`);
   ["rookie","prime1","prime2","veteran"].forEach(st=>{
     const t=p.titles.find(x=>x.stage===st); if(t)a.push(`${LABEL[st]}：${t.name}`);
   });
   a.push(`FINAL：🏆${p.nfl.a} 📈${p.nfl.p} 🔥${p.nfl.f} 🤝${p.nfl.b}`);
   if(p.legacy)a.push(`LEGACY：${p.legacy.rank} — ${p.legacy.name}`);
   a.push("");
 });
 document.getElementById("summary").textContent=a.join("\n");document.getElementById("modal").classList.add("show")
}
render();

</script>
</body>
</html>
