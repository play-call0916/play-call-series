function makeChoiceDeck(){
  const deck=[];
  C.choice.forEach(card=>{
    for(let i=0;i<3;i++) deck.push(card);
  });
  return shuffle(deck);
}
function makeFateDeck(stage){
  return shuffle([...(C[stage+"_fate"]||[])]);
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function initFiniteDecks(){
  state.choiceDeck=makeChoiceDeck();
  state.fateDecks={
    highschool:makeFateDeck("highschool"),
    college:makeFateDeck("college"),
    rookie:makeFateDeck("rookie"),
    prime1:makeFateDeck("prime1"),
    prime2:makeFateDeck("prime2"),
    veteran:makeFateDeck("veteran")
  };
}
function drawChoiceOffer(){
  if(!state.choiceDeck || state.choiceDeck.length<3){
    state.choiceDeck=makeChoiceDeck();
  }
  const picked=state.choiceDeck.splice(0,3);
  state._currentOffer=picked;
  return picked;
}
function resolveChoiceSelection(name){
  const offer=state._currentOffer||[];
  const selectedIndex=offer.findIndex(c=>c[0]===name);
  const unselected=offer.filter((_,i)=>i!==selectedIndex);
  // chosen card stays out; unselected cards return to deck, then reshuffle
  state.choiceDeck=shuffle([...(state.choiceDeck||[]),...unselected]);
  state._currentOffer=[];
}
function drawFiniteFate(stage){
  if(!state.fateDecks) state.fateDecks={};
  if(!state.fateDecks[stage] || state.fateDecks[stage].length===0){
    state.fateDecks[stage]=makeFateDeck(stage);
  }
  return state.fateDecks[stage].shift();
}

  ["🌟 チームレジェンド",{a:1,p:1,f:1,b:4},s=>s.b>=18&&hasAny(["🫡 チームキャプテン","❤️ ファン人気No.1"]),"🤝18以上＋指定Prime②称号"],
  ["👑 フランチャイズプレイヤー",{p:2,f:1,b:5},s=>s.b>=20&&hasAny(["⭐ スーパースター","🎤 リーグの顔"]),"🤝20以上＋指定Prime②称号"],
  ["🤝 チーム一筋",{f:1,b:7},s=>s.b>=22&&tag("移籍")==0,"🤝22以上・移籍なし"],["❤️ ウォルター・ペイトン賞",{p:1,f:2,b:5},s=>s.b>=20&&tag("社会貢献")>=2,"🤝20以上・社会貢献2枚以上"],
  ["🏅 殿堂入り候補",{a:2,p:3,b:3},s=>s.a>=5&&s.p>=20,"🏆5以上・📈20以上"],["💪 鉄人ベテラン",{p:2,f:3,b:1},s=>s.f>=18&&tag("怪我")==0,"🔥18以上・怪我なし"],
  ["🎤 引退ツアー",{p:1,f:1,b:5},s=>s.b>=22&&hasAny(["❤️ ファン人気No.1","🎤 リーグの顔"]),"🤝22以上＋指定Prime②称号"],["📉 忘れられたベテラン",{p:-1,b:-1},s=>true,"上記を満たさない場合"]
 ]
};
const L=[
 ["SS","🌌 Living Legend",s=>s.a>=7&&s.p>=35&&s.f>=20&&s.b>=20],
 ["S","👑 GOAT",s=>s.a>=8&&s.p>=30&&has("👑 MVP")&&has("🏅 殿堂入り候補")],
 ["S","🏆 Hall of Fame",s=>s.a>=5&&s.p>=25&&has("🏅 殿堂入り候補")],
 ["S","❤️ People's Champion",s=>s.b>=28&&has("❤️ ファン人気No.1")&&has("🎤 引退ツアー")],
 ["S","⚔ Legendary Underdog",s=>s.f>=28&&has("🔥 苦労人ルーキー")&&(has("🔄 復活賞")||has("🔥 執念の男"))],
 ["A","🌟 Franchise Legend",s=>s.b>=28&&has("👑 フランチャイズプレイヤー")],
 ["A","🏈 Team Legend",s=>s.b>=23&&has("🌟 チームレジェンド")],
 ["A","🌱 Cinderella Story",s=>state.draft.includes("UDFA")&&s.f>=23&&s.b>=23],
 ["A","⭐ Superstar",s=>s.p>=30&&has("⭐ スーパースター")],
 ["A","👑 Face of the League",s=>s.b>=28&&has("🎤 リーグの顔")],
 ["A","🤝 Heart & Soul",s=>s.b>=23&&has("🫡 チームキャプテン")],
 ["A","💪 Iron Man",s=>s.f>=23&&(has("💪 鉄人")||has("💪 鉄人ベテラン"))],
 ["A","❤️ Walter Payton Legacy",s=>has("❤️ ウォルター・ペイトン賞")],
 ["B","🏆 Champion",s=>has("🏆 SB制覇")],["B","📖 Record Chaser",s=>has("📖 記録更新")],["B","🤝 Loyal One",s=>has("🤝 チーム一筋")],["B","🧳 Journeyman",s=>has("🧳 ジャーニーマン")],
 ["C","🏈 引退",s=>true]
];
function fresh(){return{
 stage:"start",
 student:{a:0,p:0,f:0,b:0},
 nfl:{a:0,p:0,f:0,b:0},
 draft:"",
 cards:[],
 titles:[],
 phase:"intro",
 offer:[],
 draw:null,
 legacy:null,
 choiceCount:0,
 fateCount:0,
 choiceDeck:[],
 fateDecks:{},
 _currentOffer:[]
}}
let state=(()=>{try{
 const s=JSON.parse(localStorage.getItem(K))||fresh();
 if(!Array.isArray(s.choiceDeck)) s.choiceDeck=[];
 if(!s.fateDecks) s.fateDecks={};
 if(!Array.isArray(s._currentOffer)) s._currentOffer=[];
 return s;
}catch(e){return fresh()}})();
function save(){localStorage.setItem(K,JSON.stringify(state))}
function sum(s){return s.p+s.f+s.b}
function add(s,e){["a","p","f","b"].forEach(k=>s[k]=(s[k]||0)+(e[k]||0))}
function eff(e){return [["a","🏆"],["p","📈"],["f","🔥"],["b","🤝"]].filter(([k])=>e[k]).map(([k,x])=>x+(e[k]>0?"+":"")+e[k]).join(" ")}
function rand(arr,n=1){let x=[...arr];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x.slice(0,n)}
function tag(t){return state.cards.filter(c=>c.tag===t&&["rookie","prime1","prime2","veteran"].includes(c.stage)).length}
function has(n){return state.titles.some(x=>x.name===n)} function hasAny(a){return a.some(has)}
function fateTarget(stage){
  if(stage==="highschool") return 2;
  if(stage==="college") return 3;
  if(["rookie","prime1","prime2","veteran"].includes(stage)) return 3;
  return 0;
}
function drawUniqueFate(stage){return drawFiniteFate(stage)}


function stageHistory(stage){
 const cs=state.cards.filter(c=>c.stage===stage && (c.source==="choice"||c.source==="fate"));
 if(!cs.length) return "";
 return `<div class=stagehistory><div class=hh>このステージの履歴</div>${cs.map((c,i)=>`<div class=historyrow><span class=num>${i+1}</span><span><b>${c.name}</b><br><span style="color:#9aa5b3">${eff(c.e)}</span></span><span class=kind>${c.source==="choice"?"選択":"運命"}</span></div>`).join("")}</div>`;
}
function stats(s){return `<div class="stats">${[["🏆","実績",s.a],["📈","成績",s.p],["🔥","努力",s.f],["🤝","物語",s.b]].map(x=>`<div class=stat><div class=k>${x[0]} ${x[1]}</div><div class=v>${x[2]}</div></div>`).join("")}</div>`}

function deckInfo(){
 if(["rookie","prime1","prime2","veteran"].includes(state.stage)){
   const fateLeft=(state.fateDecks&&state.fateDecks[state.stage])?state.fateDecks[state.stage].length:0;
   const choiceLeft=(state.choiceDeck||[]).length;
   return `<div class=desc style="font-size:10px;margin-top:-3px">有限山札：選択 ${choiceLeft}/60枚 ・ ${LABEL[state.stage]}運命 ${fateLeft}枚</div>`;
 }
 return "";
}
function progress(){let i=STAGES.indexOf(state.stage);return `<div class=progress>${STAGES.map((x,j)=>`<div class="dot ${j<=i?"on":""}"></div>`).join("")}</div>`}
function start(){
 state=fresh();
 initFiniteDecks();
 state.stage="highschool";
 state.phase="choose";
 state.choiceCount=0;
 state.fateCount=0;
 state.offer=rand(C.highschool_choice,3);
 save();render()
}
function choose(name,e,tagg){
 let target=["highschool","college"].includes(state.stage)?state.student:state.nfl;
 add(target,e);
 state.cards.push({stage:state.stage,name,tag:tagg,e,source:"choice"});
 state.choiceCount=(state.choiceCount||0)+1;

 if(state.stage==="highschool"||state.stage==="college"){
   state.phase="fate";
   state.draw=drawFiniteFate(state.stage);
 } else {
   resolveChoiceSelection(name);
   if(state.choiceCount<3){
     state.phase="choose";
     state.offer=drawChoiceOffer();
   } else {
     state.phase="fate";
     state.draw=drawFiniteFate(state.stage);
   }
 }
 save();render()
}
function revealFate(){
 let [name,e,tagg]=state.draw;
 let target=["highschool","college"].includes(state.stage)?state.student:state.nfl;
 add(target,e);
 state.cards.push({stage:state.stage,name,tag:tagg,e,source:"fate"});
 state.fateCount=(state.fateCount||0)+1;
 state.phase="fateResult";
 save();render()
}

function continueAfterFate(){
 if(state.fateCount < fateTarget(state.stage)){
   state.phase="fate";
   state.draw=drawFiniteFate(state.stage);
 } else {
   state.phase="result";
 }
 save();render()
}
function nextFromStudent(){
 if(state.stage==="highschool"){
   state.stage="college";
   state.phase="choose";
   state.choiceCount=0;
   state.fateCount=0;
   state.offer=rand(C.college_choice,3)
 } else {
   state.stage="draft";
   state.phase="result";
   state.choiceCount=0;
   state.fateCount=0;
 }
 save();render()
}
function doDraft(){
 let d=D.find(x=>x[1](state.student));state.draft=d[0];state.nfl={a:0,p:0,f:0,b:0};add(state.nfl,d[2]);state.cards.push({stage:"draft",name:d[0],tag:"ドラフト",e:d[2]});state.phase="drafted";save();render()
}
function enterNFL(){
 state.stage="rookie";
 state.phase="choose";
 state.choiceCount=0;
 state.fateCount=0;
 state.offer=drawChoiceOffer();
 save();render()
}
function titleOptions(){return (T[state.stage]||[]).map(x=>({name:x[0],e:x[1],ok:x[2](state.nfl),reason:x[3]}))}
function takeTitle(n,e){
 add(state.nfl,e);
 state.titles.push({stage:state.stage,name:n,e});
 state.phase="titleReward";
 save();render()
}

function titleIcon(n){
 if(n.includes("新人王")) return "👑";
 if(n.includes("SB")) return "🏆";
 if(n.includes("MVP")||n.includes("OPOY")||n.includes("DPOY")) return "⚡";
 if(n.includes("殿堂")) return "🏅";
 if(n.includes("ファン")||n.includes("人気")) return "❤️";
 if(n.includes("キャプテン")) return "🫡";
 if(n.includes("ジャーニー")) return "🧳";
 if(n.includes("鉄人")||n.includes("執念")) return "🔥";
 return "🏅";
}
function titleCopy(n){
 const x=n.replace(/^[^ ]+ /,"");
 return `${x}。この時代を象徴する実績として、あなたのキャリアに刻まれる。`;
}
function finishTitleReward(){state.phase="complete";save();render()}
function nextNFL(){
 let map={rookie:"prime1",prime1:"prime2",prime2:"veteran",veteran:"legacy"};
 state.stage=map[state.stage];
 state.choiceCount=0;
 state.fateCount=0;
 if(state.stage==="legacy"){
   state.phase="legacy"
 }else{
   state.phase="choose";
   state.offer=drawChoiceOffer()
 }
 save();render()
}
function autoLegacy(){let x=L.find(z=>z[2](state.nfl));state.legacy={rank:x[0],name:x[1]};save();render()}
function restart(){if(confirm("新しいキャリアを始めますか？")){state=fresh();save();render()}}
function cardHTML(x){let [n,e,t]=x;return `<button class=card onclick='choose(${JSON.stringify(n)},${JSON.stringify(e)},${JSON.stringify(t)})'><b>${n}</b><div class=effect>${eff(e)}</div><div class=tag>${t}</div></button>`}
function render(){
 document.documentElement.style.setProperty("--accent",COLOR[state.stage]||"#d8ab45");
 let g=document.getElementById("game");
 if(state.stage==="start"){g.innerHTML=`<div class=panel><div class=stage>CAREER SIMULATION</div><h2>あなたのNFL人生を始める</h2><p class=desc>選択はあなたが決める。運命は選べない。高校から引退まで、一人の選手の人生を作ります。</p><button class=bigbtn onclick=start()>NEW CAREER</button><div class=news>🎮 DIGITAL MODE：この試作版はスマホだけで最後までプレイできます。高校運命2回、大学運命3回。NFL各ステージは「選択3回＋運命3回＋称号1枚」。選択カードは20種×3枚＝60枚の有限山札から毎回3枚提示し、選んだ1枚だけ消費。未選択2枚は山札へ戻します。運命カードも各ステージの有限山札から重複なしで引きます。</div></div>`;return}
 let s=["highschool","college","draft"].includes(state.stage)?state.student:state.nfl;
 let head=`${progress()}<div class=stage>${LABEL[state.stage]}</div>${stats(s)}${deckInfo()}`;
 if(state.stage==="highschool"||state.stage==="college"){
   if(state.phase==="choose")g.innerHTML=`<div class=panel>${head}<h2>${state.stage==="highschool"?"高校を選ぶ":"進学先を選ぶ"}</h2><p class=desc>提示された3枚から、あなたの道を選択してください。進学先は1回、運命は高校2回／大学3回です。</p><div class=cards>${state.offer.map(cardHTML).join("")}</div></div>`;
   else if(state.phase==="fate")g.innerHTML=`<div class=panel>${head}${stageHistory(state.stage)}<div class=reveal><div class=icon>🎴</div><h3>${LABEL[state.stage]} 運命カード</h3><p class=desc>ここから先はあなたには選べない。運命 ${state.fateCount+1} / ${fateTarget(state.stage)}</p><button class=bigbtn onclick=revealFate()>運命カードを引く</button></div></div>`;
   else if(state.phase==="fateResult"){let c=state.cards[state.cards.length-1];g.innerHTML=`<div class=panel>${head}<div class="reveal flash"><div class=icon>${c.tag==="怪我"?"🩹":"⚡"}</div><div class=stage>運命 ${state.fateCount} / ${fateTarget(state.stage)}</div><h3>${c.name}</h3><div class=effect>${eff(c.e)}</div><div class=news>${studentNews(c.name)}</div></div>${stageHistory(state.stage)}<button class=bigbtn onclick=continueAfterFate()>${state.fateCount<fateTarget(state.stage)?"次の運命へ":"ステージ結果へ"}</button></div>`}
   else {let c=state.cards[state.cards.length-1];g.innerHTML=`<div class=panel>${head}${stageHistory(state.stage)}<div class="reveal flash"><div class=icon>🏁</div><h3>${LABEL[state.stage]} COMPLETE</h3><div class=news>このステージで起きた出来事が、次のキャリアへ引き継がれます。</div><button class=bigbtn onclick=nextFromStudent()>${state.stage==="highschool"?"COLLEGEへ":"DRAFT DAYへ"}</button></div></div>`}
 } else if(state.stage==="draft"){
   if(state.phase==="result")g.innerHTML=`<div class=panel>${head}<div class=reveal><div class=icon>🏈</div><h3>DRAFT DAY</h3><p class=desc>学生時代のすべてが、この瞬間の評価につながる。</p><div class=news>学生最終値：📈${state.student.p} / 🔥${state.student.f} / 🤝${state.student.b} / 合計${sum(state.student)}</div><button class=bigbtn onclick=doDraft()>指名を待つ</button></div></div>`;
   else g.innerHTML=`<div class=panel>${head}<div class="reveal flash"><div class=icon>🎙️</div><div class=result><div class=small>WITH THE PICK...</div><div class=name>${state.draft}</div><div class=effect>${eff(state.cards[state.cards.length-1].e)}</div></div><p class=desc>ここから学生時代の属性はリセット。ドラフト称号を初期能力としてNFLキャリアが始まります。</p><button class=bigbtn onclick=enterNFL()>ENTER THE LEAGUE</button></div></div>`
 } else if(["rookie","prime1","prime2","veteran"].includes(state.stage)){
   if(state.phase==="choose")g.innerHTML=`<div class=panel>${head}<h2>${LABEL[state.stage]} — あなたの選択</h2><p class=desc>今、この選手は何を優先する？ 3枚から1枚を選択。選択 ${state.choiceCount+1} / 3</p>${stageHistory(state.stage)}<div class=cards>${state.offer.map(cardHTML).join("")}</div></div>`;
   else if(state.phase==="fate")g.innerHTML=`<div class=panel>${head}${stageHistory(state.stage)}<div class=reveal><div class=icon>🎴</div><h3>${LABEL[state.stage]} — 運命</h3><p class=desc>努力の先に何が待っているかは分からない。運命 ${state.fateCount+1} / 3</p><button class=bigbtn onclick=revealFate()>運命カードを引く</button></div></div>`;
   else if(state.phase==="fateResult"){let c=state.cards[state.cards.length-1];g.innerHTML=`<div class=panel>${head}<div class="reveal flash"><div class=icon>${c.tag==="怪我"?"🩹":c.tag==="移籍"?"✈️":"⚡"}</div><div class=stage>${LABEL[state.stage]} — 運命 ${state.fateCount}/3</div><h3>${c.name}</h3><div class=effect>${eff(c.e)}</div><div class=news>${proNews(c.name,c.tag)}</div></div>${stageHistory(state.stage)}<button class=bigbtn onclick=continueAfterFate()>${state.fateCount<3?"次の運命へ":"称号判定へ"}</button></div>`}
   else if(state.phase==="result"){
     let c=state.cards[state.cards.length-1],opts=titleOptions();g.innerHTML=`<div class=panel>${head}<div class="reveal flash"><div class=icon>${c.tag==="怪我"?"🩹":"⚡"}</div><h3>${c.name}</h3><div class=effect>${eff(c.e)}</div><div class=news>${proNews(c.name,c.tag)}</div><div class=log>${state.cards.filter(x=>x.stage===state.stage).map(x=>`<span class=chip>${x.name}</span>`).join("")}</div></div><h3 style="font-size:15px">獲得可能な称号</h3><div class=titlelist>${opts.map(o=>`<div class="title ${o.ok?"ok":""}"><div class=row><b>${o.name}</b><span class=badge>${o.ok?"条件達成":"未達"}</span></div><div class=reason>${o.reason}</div>${o.ok?`<button class=ghost onclick='takeTitle(${JSON.stringify(o.name)},${JSON.stringify(o.e)})'>この称号を獲得 ${eff(o.e)}</button>`:""}</div>`).join("")}</div></div>`;
   } else if(state.phase==="titleReward"){let t=state.titles.find(x=>x.stage===state.stage);g.innerHTML=`<div class=panel>${head}<div class="reveal flash"><div class=stage>称号を獲得しました</div><div class=rewardcard><div class=rewardtop>${LABEL[state.stage]} TITLE CARD</div><div class=rewardicon>${titleIcon(t.name)}</div><div class=rewardname>${t.name.replace(/^[^ ]+ /,"")}</div><div class=rewardeffect>${eff(t.e)}</div><div class=rewardcopy>${titleCopy(t.name)}</div></div><button class=bigbtn onclick=finishTitleReward()>称号を獲得</button></div></div>`}
   else {let t=state.titles.find(x=>x.stage===state.stage);g.innerHTML=`<div class=panel>${head}${stageHistory(state.stage)}<div class="reveal flash"><div class=icon>🏅</div><h3>${t.name}</h3><div class=news>${LABEL[state.stage]}を終え、キャリアに新たな称号が刻まれた。</div><button class=bigbtn onclick=nextNFL()>${state.stage==="veteran"?"RETIRE":"NEXT STAGE"}</button></div></div>`}
 } else {
   if(!state.legacy)g.innerHTML=`<div class=panel>${head}<div class=reveal><div class=icon>🏟️</div><h3>YOUR CAREER IS OVER</h3><p class=desc>勝利、記録、怪我、移籍、そして人々との物語。すべてを評価します。</p><div class=news>FINAL STATUS<br>🏆${state.nfl.a}　📈${state.nfl.p}　🔥${state.nfl.f}　🤝${state.nfl.b}</div><button class=bigbtn onclick=autoLegacy()>LEGACYを発表</button></div></div>`;
   else g.innerHTML=`<div class=panel>${head}<div class="reveal flash"><div class=stage>CAREER COMPLETE</div><div class="rewardcard legacycard"><div class=rewardtop>LEGACY CARD — ${state.legacy.rank} RANK</div><div class=rewardicon>👑</div><div class=rewardname>${state.legacy.name.replace(/^[^ ]+ /,"")}</div><div class=rewardcopy>偉大な功績と物語を残し、この選手のキャリアは永遠に語り継がれる。</div></div><button class=bigbtn onclick=showCareer()>CAREER SUMMARY</button><button class=ghost onclick=restart()>NEW CAREER</button></div></div>`
 }
}
function studentNews(n){return n.includes("怪我")?"思わぬアクシデント。それでもキャリアは続いていく。":n.includes("スランプ")?"評価を落とす苦しい時期。ここからどう立て直すか。":"一つの出来事が、未来のドラフト評価を変えていく。"}
function proNews(n,t){if(t==="怪我")return "キャリアに試練が訪れた。失ったものと、そこで得たものがある。";if(t==="移籍")return "環境が変わった。この決断がレガシーを左右するかもしれない。";if(n.includes("歴史的"))return "リーグ史に残るシーズン。選手の名前が歴史に刻まれる。";return "シーズンは新たな展開を迎えた。現在の属性から称号が判定される。"}
function showCareer(){
 let a=[];a.push("PLAY CALL — LEGACY MODE");a.push("CAREER SUMMARY\n");
 ["highschool","college","draft","rookie","prime1","prime2","veteran"].forEach(st=>{let cs=state.cards.filter(c=>c.stage===st);let tt=state.titles.find(t=>t.stage===st);if(cs.length||tt)a.push(`${LABEL[st]}：${cs.map(c=>(c.source==="choice"?"◆ ":"◇ ")+c.name).join(" → ")}${tt?` ｜ 🏅 ${tt.name}`:""}`)});
 a.push(`\nFINAL STATUS：🏆${state.nfl.a}  📈${state.nfl.p}  🔥${state.nfl.f}  🤝${state.nfl.b}`);a.push(`LEGACY：${state.legacy?state.legacy.rank+" — "+state.legacy.name:"未決定"}`);
 document.getElementById("summary").textContent=a.join("\n");document.getElementById("modal").classList.add("show")
}
render();
</script>
</body>
</html>
